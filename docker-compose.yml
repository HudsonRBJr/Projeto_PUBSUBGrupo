services:
  postgres:
    image: postgres:16-alpine
    container_name: mensageria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - mensageria_pg_data:/var/lib/postgresql/data

volumes:
  mensageria_pg_data:
